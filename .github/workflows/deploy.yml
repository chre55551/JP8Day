# push 到 main 就部署到 GitHub Pages。
# 有新的部署時會自動取消還在跑的舊部署，避免某次卡住擋住後面所有的部署。
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # 只公開網站本身的檔案；CLAUDE.md、docs/ 這些開發用的檔案不放上網站
      - name: 整理要公開的檔案
        run: |
          mkdir _site
          cp -r index.html prep.html sw.js manifest.webmanifest css js fonts icons images _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
